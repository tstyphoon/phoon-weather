[project]
name = "phoon-weather"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
